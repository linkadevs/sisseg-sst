<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../templates/assets/css/selecao_dados_colaborador.css">
        <!-- <link rel="shortcut icon" href="../templates/assets/img/favicon.ico" type="image/x-icon"> -->
        <title>Inspeção de EPI</title>
    </head>
    <body>
        <header>
            <button class="voltarBtn">
                <figure>
                    <img src="../templates/assets/img/seta_esquerda.png" alt="Black left-pointing arrow on white background, indicating a back or previous navigation action">
                </figure>
                Voltar
            </button>
        </header>
        <main>
            <form>
                <div class="titles">
                    <h2>Dados do colaborador</h2>
                    <h4>Função: <strong>Pedreiro</strong></h4>
                </div>
                <div class="content">
                    <div class="input">
                        <label for="nome">Nome completo do colaborador</label>
                        <input type="text" placeholder="Digite o nome completo">
                    </div>
                    <div class="input">
                        <label for="setor">Setor / Frente de serviço</label>
                        <input type="text" placeholder="Ex: Pavimento 5, subsolo, fachada">
                    </div>
                    <div class="epis">
                        <h5>EPIs a serem inspecionados:</h5>
                        <ul>
                            <li>Capacete com jugular <span>*</span></li>
                            <li>Óculos anti-impacto <span>*</span></li>
                            <li>Luvas de vaqueta/raspa <span>*</span></li>
                            <li>Luvas nitrílicas (cimento) <span>*</span></li>
                            <li>Botina com biqueira <span>*</span></li>
                            <li>Máscara PFF2 <span>*</span></li>
                            <li>Protetor auricular <span>*</span></li>
                            <li>Cinturão (altura)</li>
                        </ul>
                        <p>* EPIs obrigatórios</p>
                    </div>
                    <button type="submit">Iniciar inspeção</button>
                </div>
            </form>
        </main>
    </body>
</html>
