<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treinamentos</title>
<link rel="stylesheet" href="../templates/assets/css/treinamento_funcionario-adm.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Estilos de apoio para o preview de imagem no upload do modal.
     Se preferir, mova este bloco para o arquivo CSS externo do projeto. */
  .img-upload{
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .img-upload input[type="file"]{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
  }
  .img-upload img.img-upload-preview{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: inherit;
  }
  .img-upload .img-upload-icon{
    position: relative;
    z-index: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .img-upload.has-image .img-upload-icon{
    display: none;
  }
  .img-upload .img-upload-remove{
    position: absolute;
    top: 6px;
    right: 6px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(17, 24, 39, 0.75);
    color: #fff;
    border: none;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 2;
  }
  .img-upload.has-image .img-upload-remove{
    display: flex;
  }
</style>
</head>
<body>

<div class="page">

  <!-- Back -->
  <a href="#" class="back-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M5 12l7 7M5 12l7-7"/>
    </svg>
    Voltar
  </a>

  <!-- Header Card -->
  <div class="header-card">
    <h1>Treinamentos</h1>
    <p>Dê vida aos seus treinamentos: crie, atualize e gerencie tudo em um só lugar.</p>
    <div class="kpi-row">
      <div class="kpi-card blue">
        <div class="kpi-label">Total de Cursos</div>
        <div class="kpi-value">18</div>
      </div>
      <div class="kpi-card green">
        <div class="kpi-label">Válidos</div>
        <div class="kpi-value">10</div>
      </div>
      <div class="kpi-card red">
        <div class="kpi-label">Inválidos</div>
        <div class="kpi-value">8</div>
      </div>
    </div>
  </div>

  <!-- Search & Actions -->
  <div class="search-bar">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" class="search-input" placeholder="Busque treinamentos, cursos ou conteúdos...">
    </div>
    <button class="btn-primary" id="btnCriarTreinamento">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="btn-text">Criar treinamento</span>
    </button>
    <button class="btn-filter">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/>
      </svg>
      Filtrar
    </button>
  </div>

  <!-- Courses Grid -->
  <div class="courses-grid" id="coursesGrid"></div>

</div>

<!-- Modal: Criar novo treinamento -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-back" id="modalBackBtn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M5 12l7 7M5 12l7-7"/>
      </svg>
      Voltar
    </button>

    <h2 class="modal-title" id="modalTitle">Criar novo treinamento</h2>

    <div class="img-upload" id="imgUpload" title="Adicionar imagem">
      <span class="img-upload-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </span>
      <img class="img-upload-preview" id="imgUploadPreview" alt="Imagem do treinamento" hidden>
      <button type="button" class="img-upload-remove" id="imgUploadRemove" title="Remover imagem">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
      <input type="file" id="inputImagem" accept="image/*">
    </div>

    <div class="form-group">
      <label class="form-label" for="inputTitulo">Título</label>
      <input id="inputTitulo" class="form-input" type="text" placeholder="Digite o título do treinamento">
    </div>

    <div class="form-group">
      <label class="form-label" for="inputSubtitulo">Subtítulo</label>
      <input id="inputSubtitulo" class="form-input" type="text" placeholder="Digite o subtítulo do treinamento">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="inputCarga">Carga horária</label>
        <input id="inputCarga" class="form-input" type="text" placeholder="00:00">
      </div>
      <div class="form-group">
        <label class="form-label" for="inputValidade">Validade</label>
        <input id="inputValidade" class="form-input" type="text" placeholder="XX/XX/XXXX">
      </div>
      <div class="toggle-group">
        <span class="toggle-label">Sem validade</span>
        <input type="checkbox" class="toggle-checkbox" id="toggleSemValidade" checked>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="selectNR">NRs relacionada</label>
      <div class="form-select-wrap">
        <select id="selectNR" class="form-select">
          <option value="" disabled selected>Digite o nome do treinamento</option>
          <option value="nr06">NR-06 - EPI</option>
          <option value="nr10">NR-10 - Eletricidade</option>
          <option value="nr12">NR-12 - Máquinas e Equipamentos</option>
          <option value="nr35">NR-35 - Trabalho em Altura</option>
        </select>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-delete" id="btnExcluir">Excluir</button>
      <button class="btn-save" id="btnSalvar">Salvar</button>
    </div>
  </div>
</div>
<script src="../templates/assets/js/treinamento_funcionario-adm.js"></script>

<!-- Upload e preview de imagem do treinamento -->
<script>
  (function () {
    const imgUpload = document.getElementById('imgUpload');
    const inputImagem = document.getElementById('inputImagem');
    const preview = document.getElementById('imgUploadPreview');
    const removeBtn = document.getElementById('imgUploadRemove');

    // Seleciona um arquivo -> lê e mostra a pré-visualização dentro da div
    inputImagem.addEventListener('change', function (event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        alert('Selecione um arquivo de imagem válido.');
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        preview.src = e.target.result;
        preview.hidden = false;
        imgUpload.classList.add('has-image');
      };
      reader.readAsDataURL(file);
    });

    // Botão "x" remove a imagem e limpa o input, sem reabrir o seletor de arquivo
    removeBtn.addEventListener('click', function (event) {
      event.stopPropagation();
      preview.src = '';
      preview.hidden = true;
      inputImagem.value = '';
      imgUpload.classList.remove('has-image');
    });

    // Ao reabrir o modal para "Criar novo treinamento", reseta a pré-visualização
    document.getElementById('btnCriarTreinamento').addEventListener('click', function () {
      preview.src = '';
      preview.hidden = true;
      inputImagem.value = '';
      imgUpload.classList.remove('has-image');
    });
  })();
</script>

</body>
</html>
