<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Incidentes – SISSEG SST</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../templates/assets/css/modulo-incidente.css">
</head>
<body>

<div class="pagina-incidente">

  <div class="cabecalho-modulo">
    <div>
      <h1>Incidentes</h1>
      <p>Registro e acompanhamento de incidentes de segurança</p>
    </div>
    <button class="btn-novo-incidente" onclick="location.href='registrar-incidente.php'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Registrar Incidente
    </button>
  </div>

  <!-- Contadores -->
  <div class="contadores" id="contadores">
    <div class="contador-card ativo" data-status="todos">
      <div class="numero" id="contTodos">0</div>
      <div class="rotulo"><span class="ponto"></span>Todos os Status</div>
    </div>
    <div class="contador-card" data-status="Aberto">
      <div class="numero" id="contAberto">0</div>
      <div class="rotulo"><span class="ponto"></span>Aberto</div>
    </div>
    <div class="contador-card" data-status="Investigando">
      <div class="numero" id="contInvestigando">0</div>
      <div class="rotulo"><span class="ponto"></span>Investigando</div>
    </div>
    <div class="contador-card" data-status="Concluído">
      <div class="numero" id="contConcluido">0</div>
      <div class="rotulo"><span class="ponto"></span>Concluído</div>
    </div>
  </div>

  <!-- Filtros -->
  <div class="barra-filtros">
    <div class="campo-busca">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="inputBusca" placeholder="Buscar por descrição, local ou código (INC-001)...">
    </div>
    <div class="filtro-status" id="filtroStatus">
      <button class="ativo" data-status="todos">Todos os Status</button>
      <button data-status="Aberto">Aberto</button>
      <button data-status="Investigando">Investigando</button>
      <button data-status="Concluído">Concluído</button>
    </div>
  </div>

  <!-- Grid de cards -->
  <div class="grid-incidentes" id="gridIncidentes"></div>

  <div class="estado-vazio" id="estadoVazio" style="display:none">
    <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 9v4M12 17h.01M10.3 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L14.7 3.86a2 2 0 0 0-3.4 0z"/></svg>
    <p>Nenhum incidente encontrado com esses filtros.</p>
  </div>

</div>

<!-- Modal de edição -->
<div class="modal-overlay" id="modalEditar" style="display:none;">
  <div class="modal-editar">
    <div class="modal-cabecalho">
      <h2>Editar Incidente <span id="modalCodigo"></span></h2>
      <button class="fechar-modal" onclick="fecharModalEdicao()">&times;</button>
    </div>
    <form id="formEditarIncidente">
      <input type="hidden" name="id_incidente" id="editId">

      <div class="campo-modal">
        <label>Status</label>
        <select name="status" id="editStatus">
          <option value="Aberto">Aberto</option>
          <option value="Investigando">Investigando</option>
          <option value="Concluído">Concluído</option>
        </select>
      </div>

      <div class="linha-modal">
        <div class="campo-modal">
          <label>Tipo</label>
          <select name="tipo" id="editTipo">
            <option value="quase-acidente">Quase Acidente</option>
            <option value="condicao-insegura">Condição Insegura</option>
            <option value="acidente-lesao">Acidente com Lesão</option>
            <option value="risco-eletrico">Risco Elétrico</option>
            <option value="incendio">Incêndio / Explosão</option>
            <option value="outro">Outro</option>
          </select>
        </div>
        <div class="campo-modal">
          <label>Gravidade</label>
          <select name="gravidade" id="editGravidade">
            <option value="baixa">Baixa</option>
            <option value="media">Média</option>
            <option value="alta">Alta</option>
          </select>
        </div>
      </div>

      <div class="linha-modal">
        <div class="campo-modal">
          <label>Data</label>
          <input type="date" name="data" id="editData">
        </div>
        <div class="campo-modal">
          <label>Local</label>
          <input type="text" name="local" id="editLocal">
        </div>
      </div>

      <div class="campo-modal">
        <label>Atividade</label>
        <input type="text" name="atividade" id="editAtividade">
      </div>

      <div class="campo-modal">
        <label>Descrição do Incidente</label>
        <textarea name="descricao" id="editDescricao"></textarea>
      </div>

      <div class="campo-modal">
        <label>Testemunhas</label>
        <input type="text" name="testemunhas" id="editTestemunhas">
      </div>

      <div class="campo-modal">
        <label>Ação Imediata Tomada</label>
        <textarea name="acaoImediata" id="editAcao"></textarea>
      </div>

      <div class="campo-modal">
        <label>Treinamento de Reciclagem Necessário</label>
        <input type="text" name="treinamento" id="editTreinamento">
      </div>

      <div class="acoes-modal">
        <button type="submit" class="btn-salvar">Salvar Alterações</button>
        <button type="button" class="btn-cancelar" onclick="fecharModalEdicao()">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../templates/assets/js/modulo-incidente.js"></script>
</body>
</html>
